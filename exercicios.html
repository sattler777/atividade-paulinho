<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios 03 - 2º Bimestre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- EXERCÍCIO 1 -->
    <section>
        <h2>1. Cálculo de IMC</h2>
        <label>Peso (kg): <input type="number" id="peso" step="0.1"></label><br><br>
        <label>Altura (m): <input type="number" id="altura" step="0.01"></label><br><br>
        <button onclick="calcularIMC()">Calcular IMC</button>
        <p id="resultadoIMC"></p>
    </section>

    <!-- EXERCÍCIO 2 -->
    <section>
        <h2>2. Idade e Categoria Esportiva</h2>
        <label>Ano de nascimento: <input type="number" id="anoNascimento"></label><br><br>
        <button onclick="verificarCategoria()">Verificar Categoria</button>
        <p id="resultadoCategoria"></p>
    </section>

    <!-- EXERCÍCIO 3 -->
    <section>
        <h2>3. Juros Compostos</h2>
        <label>Valor inicial (R$): <input type="number" id="valorInicial" step="0.01"></label><br><br>
        <label>Taxa mensal (%): <input type="number" id="taxaMensal" step="0.01"></label><br><br>
        <label>Tempo em meses: <input type="number" id="tempoMeses"></label><br><br>
        <button onclick="calcularJuros()">Calcular Valor Final</button>
        <p id="resultadoJuros"></p>
    </section>

    <script>
        // Exercício 1: IMC
        function calcularIMC() {
            const peso = parseFloat(document.getElementById("peso").value);
            const altura = parseFloat(document.getElementById("altura").value);

            if (isNaN(peso) || isNaN(altura) || altura <= 0) {
                document.getElementById("resultadoIMC").innerText = "Por favor, insira peso e altura válidos.";
                return;
            }

            const imc = peso / (altura * altura);
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc <= 24.9) {
                classificacao = "Peso normal";
            } else if (imc <= 29.9) {
                classificacao = "Sobrepeso";
            } else if (imc <= 34.9) {
                classificacao = "Obesidade grau 1";
            } else if (imc <= 39.9) {
                classificacao = "Obesidade grau 2";
            } else {
                classificacao = "Obesidade grau 3";
            }

            document.getElementById("resultadoIMC").innerText = `IMC: ${imc.toFixed(2)} - Classificação: ${classificacao}`;
        }

        // Exercício 2: Idade e Categoria
        function verificarCategoria() {
            const anoNascimento = parseInt(document.getElementById("anoNascimento").value);
            const anoAtual = new Date().getFullYear();

            if (isNaN(anoNascimento) || anoNascimento > anoAtual) {
                document.getElementById("resultadoCategoria").innerText = "Por favor, insira um ano válido.";
                return;
            }

            const idade = anoAtual - anoNascimento;
            let categoria = "";

            if (idade < 12) {
                categoria = "Infantil";
            } else if (idade <= 17) {
                categoria = "Adolescente";
            } else if (idade <= 59) {
                categoria = "Adulto";
            } else {
                categoria = "Sênior";
            }

            document.getElementById("resultadoCategoria").innerText = `Idade: ${idade} anos - Categoria: ${categoria}`;
        }

        // Exercício 3: Juros Compostos
        function calcularJuros() {
            const valorInicial = parseFloat(document.getElementById("valorInicial").value);
            const taxaMensal = parseFloat(document.getElementById("taxaMensal").value);
            const tempo = parseInt(document.getElementById("tempoMeses").value);

            if (isNaN(valorInicial) || isNaN(taxaMensal) || isNaN(tempo) || tempo < 0) {
                document.getElementById("resultadoJuros").innerText = "Por favor, preencha todos os campos corretamente.";
                return;
            }

            const taxaDecimal = taxaMensal / 100;
            const valorFinal = valorInicial * Math.pow(1 + taxaDecimal, tempo);

            document.getElementById("resultadoJuros").innerText = `Valor final ao fim do período: R$ ${valorFinal.toFixed(2)}`;
        }
    </script>

</body>
</html>
